# M4 deployment target (Docker Compose) + M5 monitoring.
#
# `api` pulls the image published to GHCR by the CI pipeline, which is what
# makes `docker compose pull` in the CD workflow a real registry pull.
# Build locally instead with: docker compose -f docker-compose.yml build
services:
  api:
    build: .
    image: ghcr.io/sreekeerthi38/mlops-catsdogs:latest
    container_name: catsdogs-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model.pt
    # The model is already baked into the image by `COPY models/`. This mount
    # is a convenience for swapping in a newly trained model without a rebuild
    # -- but it SHADOWS the baked-in copy, so the host models/ directory must
    # contain model.pt (git-lfs pull) or the service will report 503.
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: catsdogs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  # M4 CD: polls GHCR every 30s and redeploys catsdogs-api when :latest changes.
  # Used instead of the GitHub Actions self-hosted runner in .github/workflows/cd.yml,
  # which is retained for reference.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: catsdogs-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup catsdogs-api
    restart: unless-stopped
