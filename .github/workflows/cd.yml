name: CD

# M4: Continuous Deployment to a Windows machine running a SELF-HOSTED runner.
#
# GitHub-hosted runners cannot reach a service on your laptop, so the deploy
# target must run the runner itself. Steps use `shell: powershell` (Windows
# PowerShell 5.1, always present) rather than bash, so there is no Git Bash
# dependency.
#
# Register a runner: repo Settings -> Actions -> Runners -> New self-hosted runner.
# Install it as a SERVICE (.\svc.ps1 install; .\svc.ps1 start) so a closed
# terminal cannot kill your demo, and make sure Docker Desktop starts first.

on:
  workflow_dispatch:
jobs:
  deploy:
    # only deploy if the CI run actually succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # docker-compose mounts ./models -- an unresolved
                             # LFS pointer here shadows the model in the image

      - name: Confirm the checked-out model is a real checkpoint
        run: |
          if (-not (Test-Path "models\model.pt")) {
            Write-Host "models/model.pt missing"; exit 1
          }
          $head = [System.IO.File]::ReadAllBytes("models\model.pt")[0..39]
          $text = [System.Text.Encoding]::ASCII.GetString($head)
          if ($text -match "git-lfs") {
            Write-Host "models/model.pt is an unresolved LFS pointer - run: git lfs pull"
            exit 1
          }
          Write-Host "model.pt OK ($((Get-Item 'models\model.pt').Length) bytes)"

      - name: Pull latest image from GHCR and redeploy
        run: |
          docker compose pull
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose up -d
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Wait for readiness
        run: |
          $ok = $false
          foreach ($i in 1..20) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8000/ready" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Write-Host "waiting for service... ($i)"
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) {
            Write-Host "service did not become ready"
            docker compose logs --tail=50 api
            exit 1
          }
          Write-Host "service is ready"

      - name: Smoke test (fails the pipeline on failure)
        run: .\scripts\smoke_test.ps1 -BaseUrl http://localhost:8000
