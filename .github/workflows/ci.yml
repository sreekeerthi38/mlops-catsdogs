name: CI

# M3: on every push AND pull request -> checkout, install deps, run tests,
# build the Docker image. On push to main -> also push to GHCR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # models/*.pt is LFS-tracked; without this the
                             # checkout leaves a ~130-byte pointer file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify the model artifact is a real checkpoint, not an LFS pointer
        run: |
          test -f models/model.pt || { echo "models/model.pt missing"; exit 1; }
          if head -c 40 models/model.pt | grep -q "git-lfs"; then
            echo "models/model.pt is an unresolved LFS pointer"; exit 1
          fi
          python -c "from src.inference import load_model; m = load_model('models/model.pt'); print('loaded arch =', m.arch)"

      - name: Run unit tests
        run: pytest -q

      # M3.2: the image must build on every push AND merge request.
      # Load-only here (no registry credentials on PRs from forks).
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: catsdogs-api:ci

      - name: Container smoke test
        run: |
          docker run -d --rm --name catsdogs-ci -p 8000:8000 catsdogs-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/ready >/dev/null && break
            echo "waiting for container... ($i)"; sleep 3
          done
          BASE_URL=http://localhost:8000 bash scripts/smoke_test.sh
          docker stop catsdogs-ci

  build-and-push:
    # only publish from main, and only if tests + image build passed
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
