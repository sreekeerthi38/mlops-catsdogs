apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-api
  labels:
    app: catsdogs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catsdogs-api
  template:
    metadata:
      labels:
        app: catsdogs-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # Required only while the GHCR package is private. Create with:
      #   kubectl create secret docker-registry ghcr-creds \
      #     --docker-server=ghcr.io --docker-username=<gh-user> \
      #     --docker-password=<PAT with read:packages>
      # Delete this block once the package is made public.
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: api
          image: ghcr.io/sreekeerthi38/mlops-catsdogs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready        # 503 until the model is actually loaded
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health       # process-level liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
